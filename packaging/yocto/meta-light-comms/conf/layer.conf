BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb"
BBFILE_COLLECTIONS += "lightcomms"
BBFILE_PATTERN_lightcomms = "^${LAYERDIR}/"
BBFILE_PRIORITY_lightcomms = "6"
LAYERDEPENDS_lightcomms = "core"
# Initial target; other branches require their own parse/build evidence.
LAYERSERIES_COMPAT_lightcomms = "scarthgap"
