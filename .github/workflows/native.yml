# SPDX-License-Identifier: GPL-3.0-only
name: Native build and tests
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  native:
    if: github.repository == 'active-esl/ieee802157-core'
    runs-on: [self-hosted, Linux, X64, aesl, esl-proxmox]
    container: ubuntu:24.04
    defaults:
      run:
        shell: bash
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
        sanitizers: ['OFF']
        include:
          - compiler: gcc
            build_type: Debug
            sanitizers: 'ON'
          - compiler: clang
            build_type: Debug
            sanitizers: 'ON'
    env:
      CC: ${{ matrix.compiler }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONOPTIMIZE: '0'
    steps:
      - name: Install runner build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential clang libclang-rt-18-dev cmake ninja-build python3 git ca-certificates
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DOCC_ENABLE_SANITIZERS=${{ matrix.sanitizers }}
      - name: Build
        run: timeout 180s cmake --build build --parallel 2
      - name: Test
        run: timeout 60s ctest --test-dir build --output-on-failure
